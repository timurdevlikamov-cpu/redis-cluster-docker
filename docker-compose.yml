services:
  redis-node-0: &redis-base
    container_name: redis-node-0
    image: redis:7-alpine
    user: "1000:1000"
    command: ["redis-server", "--cluster-enabled", "yes", "--cluster-config-file", "/data/nodes.conf", "--cluster-node-timeout", "5000"]
    networks:
      - redis-net
    volumes:
      - ./data/node-0:/data

  redis-node-1:
    <<: *redis-base
    container_name: redis-node-1
    command: ["redis-server", "--cluster-enabled", "yes", "--cluster-config-file", "/data/nodes.conf", "--cluster-node-timeout", "5000"]
    networks:
      - redis-net
    volumes:
      - ./data/node-1:/data

